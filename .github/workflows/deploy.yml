name: Deploy Monitoring Dashboard

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install and build client
        run: |
          cd client
          npm ci
          npm run build

      - name: Prepare deploy bundle
        run: |
          mkdir -p bundle
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='client/node_modules' \
            --exclude='client/src' \
            ./ bundle/
          cd bundle
          npm ci --production
          tar czf ../deploy-bundle.tar.gz .
          ls -lh ../deploy-bundle.tar.gz

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: ./artifacts

      - name: Install Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      - name: Wait for Tailscale connection
        run: |
          sleep 5
          tailscale status | head -5

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          cat ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_SSH_PORT || '22' }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /tmp/monitor-deploy"

      - name: Copy bundle to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -P ${{ secrets.SERVER_SSH_PORT || '22' }} \
            ./artifacts/deploy-bundle.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/monitor-deploy/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_SSH_PORT || '22' }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'set -e && cd /tmp/monitor-deploy && cp /opt/monitoring-dashboard/.env /tmp/monitor-deploy/.env.bak 2>/dev/null || true && rm -rf /opt/monitoring-dashboard/* && tar xzf deploy-bundle.tar.gz -C /opt/monitoring-dashboard && cp /tmp/monitor-deploy/.env.bak /opt/monitoring-dashboard/.env 2>/dev/null || true && sudo systemctl restart monitoring-dashboard && sleep 2 && systemctl is-active monitoring-dashboard && echo "Deploy complete"'

      - name: Cleanup
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_SSH_PORT || '22' }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "rm -rf /tmp/monitor-deploy" || true
